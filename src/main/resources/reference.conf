otoroshi {
  admin-extensions {
    configurations {
      cloud-apim_extensions_eventbrokers {
        enabled = true
        enabled = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_ENABLED}
        # every node keeps one client per connection, connected in the background
        connections {
          # how long one connection attempt may take
          connect-timeout = 10s
          connect-timeout = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_CONNECT_TIMEOUT}
          # a connection that cannot connect tries again, waiting twice as long each time, up to max-backoff
          retry {
            min-backoff = 1s
            min-backoff = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_RETRY_MIN_BACKOFF}
            max-backoff = 30s
            max-backoff = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_RETRY_MAX_BACKOFF}
          }
          # a connected client is checked against its broker at this interval. after max-failures failed
          # checks in a row it is closed and built again
          healthcheck {
            interval = 10s
            interval = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_HEALTHCHECK_INTERVAL}
            timeout = 5s
            timeout = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_HEALTHCHECK_TIMEOUT}
            max-failures = 3
            max-failures = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_HEALTHCHECK_MAX_FAILURES}
          }
          # when settings change or a connection is deleted, how long the streams still open on the
          # previous client may go on before it is closed
          retire-grace-period = 30s
          retire-grace-period = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_RETIRE_GRACE_PERIOD}
          # how long closing a client may take
          close-timeout = 10s
          close-timeout = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_CLOSE_TIMEOUT}
        }
        # events pushed to http endpoints. one node at a time delivers each webhook: alone, otoroshi
        # delivers them all; in a cluster, the nodes decide in a redis they share, which is required
        webhooks {
          enabled = true
          enabled = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_WEBHOOKS_ENABLED}
          redis {
            uri = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_WEBHOOKS_REDIS_URI}
          }
          # how long a node keeps a webhook without saying it still has it: another node takes it over then
          lock-ttl = 15s
          lock-ttl = ${?CLOUD_APIM_EXTENSIONS_EVENT_BROKERS_WEBHOOKS_LOCK_TTL}
          # the kinds of nodes that deliver webhooks, in a cluster
          node-kinds = ["leader", "worker"]
        }
      }
    }
  }
}
