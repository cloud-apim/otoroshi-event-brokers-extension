# every broker the extension speaks to, on its default port, for local development:
#   docker compose up -d            (or: docker compose up -d kafka redis)
# the integration tests do not use this file, they start their own containers.
services:
  ######################################################################################################################
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - "kafka-volume:/var/lib/kafka/data"
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports:
      - "8000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
  ######################################################################################################################
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
  ######################################################################################################################
  pulsar:
    image: apachepulsar/pulsar:4.0.5
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    volumes:
      - "pulsar-volume:/pulsar/data"
  ######################################################################################################################
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - "redis-volume:/data"
  ######################################################################################################################
  mosquitto:
    image: eclipse-mosquitto:2.0.21
    # the stock configuration only listens on the loopback of the container
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
  ######################################################################################################################
  artemis:
    image: apache/artemis:2.55.0-alpine
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      # core (and every other protocol), and the console on http://localhost:8161
      - "61616:61616"
      - "8161:8161"
  ######################################################################################################################
volumes:
  kafka-volume:
  pulsar-volume:
  redis-volume:
